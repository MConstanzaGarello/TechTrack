# Blueprint de Render para TechTrack (planes gratuitos).
# Crea la base PostgreSQL y el servicio web, y conecta uno con otro.
databases:
  - name: techtrack-db
    plan: free
    databaseName: techtrack
    user: techtrack

services:
  - type: web
    name: techtrack
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate &&
      python manage.py cargar_demo
    startCommand: gunicorn techtrack.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: techtrack-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TECHTRACK_DEMO_PASSWORD
        sync: false
